# Scheduled fetch of AYN's shipment dashboard. Merges new drops into
# public/data.json, commits, and deploys. The data commit uses GITHUB_TOKEN,
# which does NOT trigger other workflows — so this workflow deploys itself.
name: update data

on:
  schedule:
    - cron: '23 7,19 * * *' # twice daily; the page changes at most once a day
  workflow_dispatch:

permissions:
  contents: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and merge
        run: node scripts/fetch.mjs
      - name: Commit if changed
        id: commit
        run: |
          if ! git diff --quiet public/data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data.json
            git commit -m "data: $(date -u +%F) fetch"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler@4 deploy
      - name: Alert hubbub on failure
        if: failure()
        env:
          ALERT_URL: ${{ secrets.HUBBUB_ALERT_URL }}
        run: |
          [ -n "$ALERT_URL" ] || exit 0
          curl -fsS -m 10 \
            -H "Title: ayn-thor-tracker update failed" \
            -H "Priority: high" \
            -H "Tags: warning,package" \
            -d "Scheduled fetch/parse of AYN's shipment dashboard failed (zero drops or fetch error). https://github.com/ryanlewis/ayn-thor-tracker/actions" \
            "$ALERT_URL" || true
