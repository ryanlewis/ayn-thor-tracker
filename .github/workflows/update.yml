# Scheduled fetch of AYN's shipment dashboard. Merges new drops into
# public/data.json, commits, and deploys. The data commit uses GITHUB_TOKEN,
# which does NOT trigger other workflows — so this workflow deploys itself.
name: update data

on:
  schedule:
    - cron: '23 7,19 * * *' # twice daily; the page changes at most once a day
  workflow_dispatch:

permissions:
  contents: write

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Fetch and merge
        run: node scripts/fetch.mjs
      - name: Commit if changed
        id: commit
        run: |
          if ! git diff --quiet public/data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data.json
            git commit -m "data: $(date -u +%F) fetch"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm ci --ignore-scripts
          npx wrangler deploy
      - name: Alert hubbub on failure
        if: failure()
        env:
          HUBBUB_KEY: ${{ secrets.HUBBUB_ALERT_KEY }}
        run: |
          [ -n "$HUBBUB_KEY" ] || exit 0
          curl -fsS -m 10 \
            -H "Authorization: Bearer $HUBBUB_KEY" \
            -H "Content-Type: application/json" \
            -d '{"title":"ayn-thor-tracker update failed","message":"Scheduled fetch/parse of AYN'"'"'s shipment dashboard failed (zero drops or fetch error). https://github.com/ryanlewis/ayn-thor-tracker/actions","priority":"high"}' \
            https://notify.rlew.io/v1/notify || true
