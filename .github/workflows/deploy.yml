# Deploys on human pushes (data commits from update.yml deploy themselves —
# GITHUB_TOKEN pushes don't trigger this workflow).
name: deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests
        run: node --test
      - name: Install
        run: npm ci --ignore-scripts
      # The token is step-scoped so install/test never see it. Gate on the
      # paired account-id var: the secrets context isn't allowed in step `if`.
      - name: Deploy to Cloudflare
        if: vars.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
